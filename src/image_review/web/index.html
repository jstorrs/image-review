<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>image-review</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
<label class="reviewer">Reviewer <input id="reviewer" type="text" autocomplete="off" spellcheck="false" required></label>
<span id="mode">Single</span>
<span id="item-status" hidden></span>
<span id="scale" hidden title="Display scale: below 100% the image is shrunk and small text may be lost"></span>
<span id="progress"></span>
<span id="where"></span>
</header>
<main id="stage">
<img id="image" alt="" hidden>
<canvas id="grid" width="0" height="0" hidden></canvas>
<p id="placeholder" class="notice" hidden></p>
<p id="message" class="notice" hidden></p>
</main>
<footer class="bar">
<div class="controls">
<button type="button" tabindex="-1" id="prev" disabled>&larr; Previous</button>
<button type="button" tabindex="-1" id="clean" class="verdict" disabled>Clean (c)</button>
<button type="button" tabindex="-1" id="dirty" class="verdict" disabled>Dirty (d)</button>
<button type="button" tabindex="-1" id="next" disabled>Next &rarr;</button>
<button type="button" tabindex="-1" id="undo" disabled>Undo (z)</button>
<button type="button" tabindex="-1" id="done">Done (q)</button>
</div>
<button type="button" tabindex="-1" id="reconnect" hidden>Reconnect (r)</button>
<p id="status" role="status">loading...</p>
<p class="help">Keys: c clean &middot; d dirty &middot; &larr;/&rarr; navigate &middot; z undo &middot; m grid &middot; M grid (no rotation) &middot; s single &middot; b next batch (grid) &middot; r reconnect (when shown) &middot; q done (wait for the next serve)</p>
</footer>
</body>
</html>
