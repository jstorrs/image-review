[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-review"
version = "0.4.0"
description = "A command-line tool for reviewing medical (DICOM) and general images for burned-in Protected Health Information (PHI)."
readme = "README.md"
authors = [{name = "Judd Storrs"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.12"
dependencies = [
    # Minimums verified by running the test suite on CPython 3.12, installing wheels only (except
    # rectpack, which has only an sdist), and CI's `minimums` job repeats this. Where no comment says
    # why, the minimum is the oldest release with a CPython 3.12 wheel.
    # Core: what `serve`, `status` and `export` need (and the CLI itself, including --help), plus
    # the grid layout code (layout.py) shared by the viewer and, later, serve's browser client.
    "click>=8.3.0",  # tests: separate CliRunner stderr, envvar values validated (8.2.2 has both but is yanked)
    "cryptography>=41",  # 3.1 is the oldest that runs; 41 is a floor without old known CVEs
    "rectpack==0.2.2",  # unmaintained, sdist only; grid packing results depend on its exact behaviour
]

[project.urls]
Homepage = "https://github.com/jstorrs/image-review"
Documentation = "https://jstorrs.github.io/image-review/"
Changelog = "https://github.com/jstorrs/image-review/blob/main/CHANGELOG.md"
Issues = "https://github.com/jstorrs/image-review/issues"

[project.optional-dependencies]
# `preprocess`; without the codecs extra a compressed DICOM is listed in skipped.tsv as "cannot decode <syntax>"
preprocess = [
    "imagecodecs>=2024.6.1",  # 16-bit colour and alpha PNGs, which Pillow truncates to their high byte
    "matplotlib>=3.8.4",  # older releases require numpy < 2
    "numpy>=2.1",  # imagecodecs 2026.5.10 and later require it; the floors are tested with it
    "pydicom>=3.0.1",  # 3.0.0 fails on float pixel data (missing Bits Stored); pydicom.pixels, set_pixel_data (tests)
    "Pillow>=10.3,!=11.*",  # 10.3: 16-bit grayscale PNG; 11.x misdecodes an MPO frame after a mode change
    "scikit-image>=0.23.1",  # older releases fail to import with numpy 2
    "scipy>=1.13",  # older releases require numpy < 2
    "tifffile>=2024.1.30",  # 16-bit RGB and CMYK TIFFs, which Pillow truncates; older releases fail with numpy 2
    "tqdm>=4.60",  # tqdm.contrib.logging
]
# Pixel-data decoders pydicom uses for compressed DICOMs during `preprocess`
codecs = [
    "python-gdcm>=3.0.25",  # older releases "decode" a corrupt JPEG 2000 codestream without error
    "pylibjpeg>=2.0",  # what pydicom 3 supports
    "pylibjpeg-openjpeg>=2.3",  # older releases require numpy < 2
]
# `review`, local or the deprecated --remote
viewer = [
    "pygame-ce>=2.3.1",
    "Pillow>=10.3,!=11.*",  # 10.3: 16-bit grayscale PNG; 11.x misdecodes an MPO frame after a mode change
]
all = ["image-review[preprocess,codecs,viewer]"]
dev = [
    "image-review[all]",  # the tests exercise every command
    "ruff>=0.16",
    "mypy>=1.16",  # older releases misread the numpy 2.x stubs
    "types-tqdm",
    "coverage>=7",
]
# The documentation site (`sphinx-build`); no command needs it
docs = [
    "sphinx>=8",
    "myst-parser>=4",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5",
]

[tool.setuptools.package-data]
image_review = ["fonts/*.ttf", "web/*.html", "web/*.js", "web/*.css"]

[project.scripts]
image-review = "image_review.cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Explicit so that other ruff versions lint the same rule families. Left out as too noisy for this project:
# D (docstrings), PT (the tests use unittest), T (print is the CLI's output), N and PTH (naming/pathlib churn).
select = [
    "ASYNC", "B", "BLE", "C4", "DTZ", "E", "EXE", "F", "FA", "FLY", "FURB", "G", "I", "INT", "ISC", "LOG",
    "PERF", "PGH", "PIE", "PL", "PYI", "RET", "RUF", "S", "SIM", "TC", "TRY", "UP", "W", "YTT",
]
ignore = [
    "E501",     # line length is left to the formatter
    "B904",     # click handlers re-raise as ClickException; chaining would change tracebacks
    "PLC0415",  # imports are deferred on purpose (optional dependencies, startup time)
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # complexity and magic-value heuristics
    "RET504",   # naming the value before returning it is often clearer
    "S101",     # asserts narrow Optional types for mypy
    "S104",     # binding to all interfaces is an explicit option
    "S603",     # subprocess is always called with an argument list, never a shell
    "TC006",    # unquoted cast() types are more readable
    "TRY003",   # long messages in exceptions are fine
    "TRY301",   # raise inside try is deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]  # asserts, fixed tokens, chmod and subprocess are normal in tests

[tool.mypy]
files = ["src"]
python_version = "3.12"
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["rectpack.*", "scipy.*", "skimage.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["image_review"]
branch = true

[tool.coverage.report]
fail_under = 96
show_missing = true
