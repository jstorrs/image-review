site_name: image-review
site_description: Human review of preprocessed medical images for burned-in PHI
site_url: https://jstorrs.github.io/image-review/
repo_url: https://github.com/jstorrs/image-review
repo_name: jstorrs/image-review
edit_uri: edit/main/docs/
theme:
  name: material
  font: false
  features: [navigation.tabs, navigation.sections, navigation.top, search.highlight, content.code.copy, content.action.edit]
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Switch to light mode}
validation: {omitted_files: warn, absolute_links: warn, unrecognized_links: warn, anchors: warn}
hooks: [mkdocs_hooks.py]
markdown_extensions:
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets: {base_path: [.], check_paths: true}
  - mdx_truly_sane_lists: {nested_indent: 2}
nav:
  - Home: index.md
  - Getting started:
      - Installation: install.md
      - Quick start: quickstart.md
  - Commands:
      - Overview: commands/index.md
      - preprocess: commands/preprocess.md
      - review: commands/review.md
      - status: commands/status.md
      - export: commands/export.md
      - serve: commands/serve.md
  - Reference:
      - Changelog: reference/changelog.md
